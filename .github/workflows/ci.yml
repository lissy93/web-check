name: 🚦 PR Quality Check

on:
  pull_request:
    branches: ['master']
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔎 Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      lockfile: ${{ steps.check.outputs.lockfile }}
      workflows: ${{ steps.check.outputs.workflows }}
    steps:
      - name: Check for lockfile and workflow changes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_FILES: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files
        run: |
          FILES=$(gh api "$PR_FILES" --paginate -q '.[].filename')
          has() { grep -qE "$1" <<< "$FILES" && echo true || echo false; }
          echo "lockfile=$(has '^yarn\.lock$')" >> "$GITHUB_OUTPUT"
          echo "workflows=$(has '^\.github/(workflows/|zizmor\.yml$)')" >> "$GITHUB_OUTPUT"

  lint:
    name: 📝 Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint

  typecheck:
    name: 🧷 Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Astro Check
        run: yarn typecheck

  format:
    name: 🎨 Format Check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Prettier
        run: yarn format:check

  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Project
        run: yarn build

      - name: Verify Build Output
        run: |
          if [ ! -d "dist/client" ]; then
            echo "❌ Build failed: dist/client directory not created"
            exit 1
          fi
          if [ ! -f "dist/server/entry.mjs" ]; then
            echo "❌ Build failed: SSR entry not found"
            exit 1
          fi
          echo "✅ Build successful"

      - name: Bundle Functions Like Netlify
        run: yarn zip-it-and-ship-it --archive-format none api /tmp/functions > /dev/null

      - name: Launch Browser From Netlify Bundle
        run: |
          node -e "
            const { launchBrowser, closeBrowser } = require('/tmp/functions/screenshot/api/_common/browser.js');
            launchBrowser().then(closeBrowser);
          "

  docker-smoke:
    name: 🐳 Docker Smoke Test
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Buildx, Pulling via Docker Hub Mirror
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build Docker Image
        run: docker buildx build --load -t web-check:test .
        timeout-minutes: 25

      - name: Verify Container Starts
        timeout-minutes: 5
        run: |
          docker run -d --name wc-test -p 3000:3000 web-check:test
          for _ in $(seq 60); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' wc-test)
            [ "$STATUS" = "starting" ] || break
            sleep 2
          done
          if [ "$STATUS" != "healthy" ]; then
            echo "❌ Container never became healthy (status: $STATUS)"
            docker logs wc-test
            exit 1
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/check || true)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ GUI not serving (HTTP $HTTP_CODE)"
            docker logs wc-test
            exit 1
          fi
          echo "✅ Container healthy and serving"
          docker stop wc-test && docker rm wc-test

  dependency-review:
    name: 🔒 Dependency Review
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.lockfile == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Review Dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  workflow-audit:
    name: 🛠️ Workflow Audit
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Actionlint
        uses: raven-actions/actionlint@v2
        with:
          fail-on-error: true

      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@v0.8.0
        with:
          inputs: .github/workflows/
          advanced-security: false
          annotations: true
