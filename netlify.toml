# Build settings and site core config
[build]
  base = "/"
  command = "yarn build"
  publish = "dist"
  functions = "api"

# Environmental variables and optional secrets
[build.environment]
  PLATFORM = "netlify"
  PUBLIC_API_ENDPOINT = "/.netlify/functions"
  NODE_VERSION = "22"  # Astro 7 needs Node >=22.23.4, so pin a compatible version
  # Build configuration env vars (uncomment if you want to configure these)
  # CI="false" # Set CI to false, to prevent warnings from exiting the build
  # CHROME_PATH='/usr/bin/chromium' # Path to Chromium binary

  # Optional secrets and API keys (uncomment if you want to add these)
  # GOOGLE_CLOUD_API_KEY=''     # Google Cloud API key, for the quality and Safe Browsing checks
  # SHODAN_API_KEY=''           # Shodan API key, for host names, server info and vulnerabilities

# Ship the tracker database with the function that reads it
[functions.trackers]
  included_files = ["node_modules/@ghostery/trackerdb/dist/trackerdb.engine"]

# Rewrite the /api/* path to the lambda functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Plugins
[[plugins]]
package = "netlify-plugin-chromium"
  [plugins.inputs]
  packageManager = "yarn"

# Set any security headers here
[[headers]]
  for = "/*"
  [headers.values]
  # Uncomment to enable Netlify user control. Requires premium plan.
  # Basic-Auth = "someuser:somepassword anotheruser:anotherpassword"
